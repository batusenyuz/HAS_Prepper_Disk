server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;
  client_max_body_size 4g;

  # Docker DNS: kiwix/kolibri yeniden başlasa da adresleri tazelenir / re-resolve on restart
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $kiwix   kiwix:8080;
  set $kolibri kolibri:8080;

  location = /        { return 302 /home/; }
  location = /home    { return 301 /home/; }
  location = /maps    { return 301 /maps/; }
  location = /admin   { return 301 /admin/; }
  location = /kolibri { return 301 /kolibri/; }

  location /home/  { try_files $uri $uri/ /home/index.html; }
  location /admin/ { try_files $uri $uri/ =404; }

  # Harita görüntüleyici + kütüphaneler / map viewer + libraries
  location /maps/ {
    try_files $uri $uri/ =404;
    location /maps/assets/ { expires 30d; }
    location /maps/lib/    { expires 30d; }
  }
  # PMTiles dosyaları: HTTP range ile parça parça okunur / read via HTTP range requests
  location /maps/data/ {
    alias /srv/maps-data/;
    add_header Cache-Control "no-cache";
    types { application/json json; application/octet-stream pmtiles; }
  }

  location /kiwix/ {
    proxy_pass http://$kiwix;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location /kolibri/ {
    proxy_pass http://$kolibri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
  }
}
