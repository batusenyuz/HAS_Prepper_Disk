# HAS_PrepperDisk Türkçe belge listesi (PDF) / Turkish document list — Docker kurulumu
# docker compose run --rm downloader docs
#
# Biçim / format (| ile ayrılır / pipe separated):
#   bölüm | dosya adı | başlık | açıklama | url [url ...]
# Birden fazla url verilirse sırayla birleştirilip tek PDF yapılır (pdfunite).
# If several urls are given they are merged into one PDF in order.
# "bölüm" ana sayfadaki bölüm başlığıyla aynı olmalı / must match a homepage section title.
#
# Belgeler kişisel çevrimdışı kullanım için kurumların kendi adreslerinden indirilir;
# telif hakları yayıncılarına aittir. / Downloaded from the publishers for personal
# offline use; copyrights belong to the publishers.

