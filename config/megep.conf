# MEB MEGEP mesleki eğitim modülleri (Türkçe PDF) — Docker kurulumu
# docker compose run --rm downloader docs     (docs.conf ile birlikte indirilir)
#
# "@ koleksiyon" satırı yeni bir koleksiyon başlatır:
#   @ <klasör> | <ana sayfa bölümü> | <başlık> | <açıklama>
# Altındaki her satır bir modül adıdır (megep.meb.gov.tr'deki adıyla birebir).
# Modül adresleri her indirmede MEGEP'in güncel listesinden bulunur.
# Modüller kişisel çevrimdışı kullanım içindir; telif hakkı MEB'e aittir.

