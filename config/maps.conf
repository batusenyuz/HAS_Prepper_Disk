# HAS_PrepperDisk harita listesi (yalnızca Docker kurulumu) / map list (Docker setup only)
# Biçim / format:  <ad / name>  <bbox: batı,güney,doğu,kuzey / west,south,east,north>  <maxzoom>
#
# İlk satır taban haritadır (tüm dünya, düşük detay). Sonraki satırlar onun üzerine çizilir.
# The first line is the base map (whole world, low detail). Later lines are drawn on top.
# Zoom: 9 ≈ şehirler / cities, 12 ≈ ana yollar / main roads, 15 = sokak / street level.
# Boyutlar Protomaps 20261102 derlemesine göre / sizes as of build 20261102.
# Boyutları görmek için / to see sizes:  docker compose run --rm downloader maps-size

world             -180,-85,180,85      9     # ~1.6 GB  dünya, şehir seviyesi / world, city level
europe-mideast    -25,12,63,72         15    # ~57 GB   Avrupa + Orta Doğu, sokak seviyesi / street level
# turkiye         25.6,35.8,44.9,42.2  15    # sadece Türkiye (küçük diskler için) / Turkey only (small disks)
