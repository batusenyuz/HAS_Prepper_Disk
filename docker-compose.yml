# HAS_PrepperDisk — Docker kurulumu / Docker setup
#
#   cp .env.example .env            # DATA_DIR, HTTP_PORT ... ayarla / adjust
#   docker compose up -d --build    # web + kiwix + kolibri
#   docker compose run --rm downloader zims   # config/content.conf içeriklerini indir
#   docker compose run --rm downloader docs   # config/docs.conf Türkçe PDF belgelerini indir
#   docker compose run --rm downloader maps   # config/maps.conf haritalarını indir
#
# Ayrıntılar / details: DOCKER.md

name: prepperdisk

x-common: &common
  restart: unless-stopped
  environment:
    TZ: ${TZ:-Europe/Istanbul}
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "3" }

services:
  web:
    <<: *common
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: prepperdisk/web:local
    ports:
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - ${DATA_DIR:-./data}/maps:/srv/maps-data:ro
      - ${DATA_DIR:-./data}/docs:/srv/docs:ro
    depends_on: [kiwix, kolibri]

  kiwix:
    <<: *common
    image: ghcr.io/kiwix/kiwix-serve:${KIWIX_VERSION:-3.8.2}
    user: "${PUID:-1000}:${PGID:-1000}"
    entrypoint: ["/bin/sh", "/opt/prepper/kiwix-start.sh"]
    volumes:
      - ${DATA_DIR:-./data}/zims:/data
      - ./docker/kiwix/kiwix-start.sh:/opt/prepper/kiwix-start.sh:ro

  kolibri:
    <<: *common
    build: ./docker/kolibri
    image: prepperdisk/kolibri:local
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${DATA_DIR:-./data}/kolibri:/data

  # Tek seferlik indirici / one-shot downloader (docker compose run --rm downloader ...)
  downloader:
    build:
      context: ./docker/tools
      args:
        KIWIX_VERSION: ${KIWIX_VERSION:-3.8.2}
    image: prepperdisk/tools:local
    user: "${PUID:-1000}:${PGID:-1000}"
    profiles: [tools]
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      PROTOMAPS_BUILD: ${PROTOMAPS_BUILD:-}
    volumes:
      - ${DATA_DIR:-./data}/zims:/data/zims
      - ${DATA_DIR:-./data}/maps:/data/maps
      - ${DATA_DIR:-./data}/docs:/data/docs
      - ./config:/config:ro
      - ./scripts:/scripts:ro
